services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: support_flow_ai
      POSTGRES_USER: supportflow_app
      POSTGRES_PASSWORD: ${SQL_PASSWORD:-change_me_in_prod}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      SQL_HOST: postgres
      SQL_DB_NAME: support_flow_ai
      SQL_USER: supportflow_app
      SQL_PASSWORD: ${SQL_PASSWORD:-change_me_in_prod}
      SQL_ADMIN_USER: supportflow_app
      SQL_ADMIN_PASSWORD: ${SQL_PASSWORD:-change_me_in_prod}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      APP_URL: ${APP_URL:-http://localhost:3000}

volumes:
  pgdata:
